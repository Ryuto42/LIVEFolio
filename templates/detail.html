<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>livefolio - detail</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <div class="header-new">
            <a href="/" class="close-btn" style="text-decoration: none;">←</a>
            <div class="header-title">live detail</div>
        </div>

        <div class="detail-image-container">
            {% if history['image_data'] %}
                <img src="{{ history['image_data'] }}" alt="Live Image">
            {% endif %}
        </div>

        <div class="detail-content">
            <div class="detail-type-tag">{{ history['live_type'] }}</div>
            <div style="font-size: 14px; color: var(--text-muted); margin-bottom: 8px;">
                {{ history['concert_date'] }}
            </div>
            <div style="font-size: 28px; font-weight: bold; margin-bottom: 8px;">
                {{ history['artist_name'] }}
            </div>
            <div style="font-size: 16px; color: var(--text-muted);">
                {{ history['event_title'] }}
            </div>
        </div>
    </div>
</body>
</html>
