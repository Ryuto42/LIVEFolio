<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>livefolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <div class="top-nav">
            <div class="toggle-switch">
                <div class="active">year</div>
                <div>artist</div>
            </div>
            <div class="search-icon">🔍</div>
        </div>

        <div class="next-live">
            <div class="next-live-label">NEXT LIVE</div>
            <div class="next-live-date">2026.12.31</div>
            <div class="next-live-title">LIVE TITLE</div>
            <div class="card-title">📍 Venue</div>
            <div class="next-live-today">...</div>
        </div>

        <div class="section-title">upcoming / past</div>
        <div class="card-list">
            {% for history in histories %}
            <div class="card">
                <div class="card-image"></div>
                <div class="card-info">
                    <div class="card-date">{{ history['concert_date'] }}</div>
                    <div class="card-artist">{{ history['artist_name'] }}</div>
                    <div class="card-title">{{ history['event_title'] }}</div>
                </div>
            </div>
            {% endfor %}
        </div>

        <a href="/new" class="fab">＋</a>

        <div class="bottom-nav">
            <div class="nav-item active">HOME</div>
            <div class="nav-item">CALENDAR</div>
            <div class="nav-item">STATS</div>
            <div class="nav-item">MY PAGE</div>
        </div>
    </div>
</body>
</html>
