<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>livefolio - new</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <div class="header-new">
            <a href="/" class="close-btn">×</a>
            <div class="header-title">new live record</div>
        </div>

        <form action="/add" method="POST" enctype="multipart/form-data">
            <div class="top-nav" style="padding-top: 0;">
                <div class="toggle-radio">
                    <input type="radio" id="type_oneman" name="live_type" value="ワンマン" checked>
                    <label for="type_oneman">ワンマン</label>
                    
                    <input type="radio" id="type_fes" name="live_type" value="フェス">
                    <label for="type_fes">フェス</label>
                    
                    <input type="radio" id="type_taiban" name="live_type" value="対バン">
                    <label for="type_taiban">対バン</label>
                </div>
            </div>

            <div class="form-container">
                <div class="form-group">
                    <label>カバー画像</label>
                    <input type="file" name="image" accept="image/*" style="padding: 12px; background: transparent;">
                </div>
                <div class="form-group">
                    <label>アーティスト名 *</label>
                    <input type="text" name="artist_name" required>
                </div>
                <div class="form-group">
                    <label>イベントタイトル *</label>
                    <input type="text" name="event_title" required>
                </div>
                <div class="form-group">
                    <label>日付 *</label>
                    <input type="date" name="concert_date" required>
                </div>
                
                <button type="submit" class="submit-btn">登録する</button>
            </div>
        </form>
    </div>
</body>
</html>
